<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>زين | إدارة الترميم</title><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="./assets/repairs.css?v=1"><link rel="stylesheet" href="./assets/luxury.css?v=6"></head><body>
<nav class="nav"><div class="shell"><a class="logo" href="./dashboard.html">زيـن <small>REPAIRS</small></a><a class="back" href="./dashboard.html">لوحة الإدارة ←</a></div></nav>
<main class="shell"><h1 style="font-size:30px">طلبات الترميم والتصنيع الخاص</h1><p class="msg" id="msg">جارٍ التحقق من الصلاحيات...</p><section id="gate" class="card" hidden><a href="./login.html">سجّل دخولك بحساب الإدارة أولًا</a></section><div id="list"></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const db=window.supabase.createClient("https://ycfmmulwumzuavgywzgy.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljZm1tdWx3dW16dWF2Z3l3emd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4NjkzNDcsImV4cCI6MjExMDQ0NTM0N30.F3tw-mkJb5IMY7cww6p3Rse0ewrPxIJQ6mwce1MpV_4");
const ST={new:'جديد - بانتظار التسعير',quoted:'تم التسعير المبدئي',accepted:'وافق - بانتظار العربون',deposit_sent:'العميل حوّل العربون - أكّد الاستلام',deposit_confirmed:'العربون مؤكد - بانتظار الشحن',shipped:'العميل شحن القطعة',received:'وصلت القطعة',final_priced:'السعر النهائي بانتظار موافقة العميل',repairing:'قيد الترميم / التنفيذ',ready:'جاهزة للإرجاع',returned:'تم التسليم',declined:'اعتذر العميل',cancelled:'ملغي'};
const NEXT_C={deposit_confirmed:[['repairing','بدء التنفيذ']],repairing:[['ready','القطعة جاهزة']],ready:[['returned','تم تسليمها للعميل']],new:[['quoted','إرسال التسعير المبدئي']],deposit_sent:[['deposit_confirmed','تأكيد استلام العربون']]};
const NEXT={new:[['quoted','إرسال التسعير المبدئي']],deposit_sent:[['deposit_confirmed','تأكيد استلام العربون']],shipped:[['received','تم استلام القطعة']],received:[['final_priced','تثبيت السعر النهائي']],repairing:[['ready','القطعة جاهزة']],ready:[['returned','تم تسليمها للعميل']]};
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function start(){const u=await db.auth.getUser();if(!u.data.user){$('gate').hidden=false;$('msg').textContent='يلزم تسجيل الدخول';return}
 const v=await db.from('staff').select('role,active').eq('user_id',u.data.user.id).maybeSingle();if(v.error||!v.data?.active||!['admin','manager'].includes(v.data.role)){$('gate').hidden=false;$('msg').textContent='الحساب لا يملك صلاحية الإدارة';return}load()}
async function load(){const r=await db.from('repair_requests').select('*').order('created_at',{ascending:false});if(r.error){$('msg').textContent='خطأ: '+r.error.message;return}
 $('msg').textContent=r.data.length?'':'لا توجد طلبات بعد';$('list').replaceChildren();
 for(const q of r.data){const d=document.createElement('div');d.className='req';const nx=(q.kind==='custom'?NEXT_C:NEXT)[q.status]||[];
 d.innerHTML='<header><b>'+(q.kind==='custom'?'[صُنع خصيصًا] ':'[ترميم] ')+esc(q.code)+' &mdash; '+esc(q.customer_name)+'</b><span class="badge">'+esc(ST[q.status]||q.status)+'</span></header><p>'+esc(q.item_type)+' | <a dir="ltr" href="https://wa.me/'+esc(q.phone.replace(/\D/g,'').replace(/^0/,'20'))+'" target="_blank">'+esc(q.phone)+'</a><br>'+esc(q.description)+'</p><div class="photos">'+(q.photo_urls||[]).map(u=>'<a href="'+esc(u)+'" target="_blank"><img src="'+esc(u)+'"></a>').join('')+'</div><div class="grid2"><label>التسعير المبدئي<input type="number" class="p" value="'+(q.prelim_price??'')+'"></label><label>العربون<input type="number" class="dp" value="'+(q.deposit_amount??'')+'"></label><label>السعر النهائي<input type="number" class="f" value="'+(q.final_price??'')+'"></label><label>ملاحظة تظهر للعميل<input class="n"></label></div><div class="row"></div>';
 const row=d.querySelector('.row');const go=async s=>{const g=c=>d.querySelector(c).value;const p=g('.p')||null,dp=g('.dp')||null,f=g('.f')||null;
  if(s==='quoted'&&!p){alert('اكتب التسعير المبدئي أولًا');return}if(s==='final_priced'&&!f){alert('اكتب السعر النهائي أولًا');return}
  const dep=(s==='quoted'&&!dp&&p)?Math.round(p*0.3):dp;
  const x=await db.rpc('zain_repair_staff_update',{p_id:q.id,p_status:s,p_note:g('.n'),p_prelim:p,p_deposit:dep,p_final:f});if(x.error)alert(x.error.message);else load()};
 for(const [s,l] of nx){const b=document.createElement('button');b.className='btn';b.textContent=l;b.onclick=()=>go(s);row.append(b)}
 const sv=document.createElement('button');sv.className='btn ghost2';sv.textContent='حفظ الأسعار والملاحظة فقط';sv.onclick=()=>go(q.status);row.append(sv);
 if(!['returned','declined','cancelled'].includes(q.status)){const c=document.createElement('button');c.className='btn ghost2';c.textContent='إلغاء الطلب';c.onclick=()=>confirm('تأكيد الإلغاء؟')&&go('cancelled');row.append(c)}
 $('list').append(d)}}
start();
</script></body></html>
