<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><script src="./assets/i18n.js?v=1"></script><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة منتجات زين</title><style>body{font-family:Tahoma;background:#110e11;color:#f5dfb5;margin:0;padding:20px}main{max-width:850px;margin:auto}h1{color:#e6bb73}section{background:#241b20;border:1px solid #916d3d;border-radius:16px;padding:18px;margin:18px 0}label{display:block;margin:12px 0}input,select,textarea{display:block;box-sizing:border-box;width:100%;padding:12px;background:#161216;color:white;border:1px solid #8c6b42;border-radius:8px;margin-top:6px}input[type=checkbox]{display:inline;width:auto}button{padding:12px;border:0;border-radius:8px;background:#e6bd7a;color:#24150d;font-weight:bold;margin:6px;cursor:pointer}.item{border-bottom:1px solid #6b5036;padding:12px;display:flex;gap:12px;align-items:center}.item img{width:80px;height:80px;object-fit:cover}a{color:#e8bf7d}#msg{color:#e6bf81}</style><main><h1>إدارة معرض زين</h1><a href="./gallery.html">فتح معرض العملاء</a><p id="msg">جاري التحقق من صلاحيات الإدارة...</p><section id="gate" hidden><a href="./login.html">سجّل دخولك بحساب الإدارة أولًا</a></section><div id="panel" hidden><section><h2>إضافة / تعديل منتج</h2><form id="form"><label>القسم<select id="cat"><option>خواتم</option><option>حلقان</option><option>أساور</option><option>سبح</option><option>أحجار</option></select></label><label>اسم المنتج<input id="name" required></label><label>كود المنتج<input id="code"></label><label>صورة المنتج<input id="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><label>وصف المنتج<textarea id="desc"></textarea></label><label><input id="published" type="checkbox" checked> نشر المنتج للعملاء</label><button id="save">حفظ ونشر</button><button type="button" id="clear">إلغاء التعديل</button></form></section><section><h2>المنتجات المحفوظة</h2><div id="items"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>const db=window.supabase.createClient("https://ycfmmulwumzuavgywzgy.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljZm1tdWx3dW16dWF2Z3l3emd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4NjkzNDcsImV4cCI6MjExMDQ0NTM0N30.F3tw-mkJb5IMY7cww6p3Rse0ewrPxIJQ6mwce1MpV_4");const el=id=>document.getElementById(id);let uid,editing=null,previousImage='';function say(x){el('msg').textContent=x}function reset(){el('form').reset();editing=null;previousImage='';el('published').checked=true}el('clear').onclick=reset;async function start(){const r=await db.auth.getUser();if(!r.data.user){el('gate').hidden=false;say('يلزم تسجيل الدخول');return}uid=r.data.user.id;const v=await db.from('staff').select('role,active').eq('user_id',uid).maybeSingle();if(v.error||!v.data?.active||!['admin','manager'].includes(v.data.role)){el('gate').hidden=false;say('الحساب لا يملك صلاحية الإدارة');return}el('panel').hidden=false;say('لوحة المنتجات جاهزة');load()}async function load(){const r=await db.from('gallery_products').select('*').order('created_at',{ascending:false});if(r.error){say('خطأ تحميل المنتجات: '+r.error.message);return}el('items').replaceChildren();for(const p of r.data){const row=document.createElement('div');row.className='item';const img=document.createElement('img');img.src=p.image_url;const name=document.createElement('span');name.textContent=p.name+' | '+p.category+' | '+(p.code||'');const edit=document.createElement('button');edit.textContent='تعديل';edit.onclick=()=>{editing=p.id;previousImage=p.image_url;el('name').value=p.name;el('code').value=p.code||'';el('cat').value=p.category;el('desc').value=p.description||'';el('published').checked=p.published;scrollTo(0,0)};const del=document.createElement('button');del.textContent='حذف';del.onclick=async()=>{if(!confirm('تأكيد حذف المنتج؟'))return;const x=await db.from('gallery_products').delete().eq('id',p.id);say(x.error?x.error.message:'تم الحذف');if(!x.error)load()};row.append(img,name,edit,del);el('items').append(row)}}el('form').onsubmit=async e=>{e.preventDefault();el('save').disabled=true;say('جاري رفع وحفظ المنتج...');try{let image_url=previousImage;const f=el('photo').files[0];if(f){if(!['image/jpeg','image/png','image/webp'].includes(f.type)||f.size>8388608)throw Error('الصورة JPG/PNG/WEBP وأقل من 8 ميجا');const ext=f.type.split('/')[1].replace('jpeg','jpg');const path=uid+'/'+crypto.randomUUID()+'.'+ext;const u=await db.storage.from('gallery-products').upload(path,f,{contentType:f.type});if(u.error)throw u.error;image_url=db.storage.from('gallery-products').getPublicUrl(path).data.publicUrl}if(!image_url)throw Error('اختر صورة للمنتج');const p={name:el('name').value.trim(),code:el('code').value.trim(),category:el('cat').value,description:el('desc').value.trim(),image_url,published:el('published').checked};const x=editing?await db.from('gallery_products').update(p).eq('id',editing):await db.from('gallery_products').insert(p);if(x.error)throw x.error;reset();say('تم حفظ المنتج بنجاح');load()}catch(err){say('تعذر الحفظ: '+err.message)}finally{el('save').disabled=false}};start();</script></html>
