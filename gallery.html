<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>معرض منتجات زين</title><style>
:root{font-family:Tahoma,Arial,sans-serif;color:#f7e9d5;background:#100e12}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#4b292d,#100e12 55%)}header{padding:30px 20px;border-bottom:1px solid #b38b54;background:#22191d}header>div,main{max-width:1200px;margin:auto}h1{color:#efc888;margin:0 0 10px}p{color:#d1bda4}a{color:#f3c77f}main{padding:24px 16px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:24px}input,select{background:#292227;color:white;border:1px solid #80613d;padding:13px;border-radius:12px;font:inherit;min-width:180px;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}.card{background:#221d21;border:1px solid #665039;border-radius:16px;overflow:hidden}.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#382d30}.content{padding:16px}.content h2{margin:0 0 8px;font-size:19px}.tag{color:#d7b579;font-size:13px}.desc{font-size:13px;line-height:1.7}.empty{padding:50px 20px;text-align:center;border:1px dashed #80613d;border-radius:18px}.card button{background:#b78b53;border:0;border-radius:9px;padding:10px 16px;cursor:pointer;font-weight:bold}dialog{border:1px solid #b78b53;border-radius:16px;background:#211b20;color:white;max-width:min(90vw,720px)}dialog img{max-width:100%;max-height:70vh;object-fit:contain;display:block;margin:auto}dialog button{margin-top:10px;padding:10px 16px}
</style></head><body><header><div><a href="./login.html">دخول المسوقين والإدارة</a><h1>معرض منتجات زين</h1><p>تصفح التصميمات والمنتجات حسب النوع والاسم والكود</p></div></header><main><div class="toolbar"><input id="search" placeholder="ابحث باسم المنتج أو الكود..." aria-label="بحث"><select id="category" aria-label="التصنيف"><option value="">كل التصنيفات</option></select></div><div id="grid" class="grid"></div><p id="status" role="status"></p></main><dialog id="preview"><img id="previewImage" alt=""><h2 id="previewTitle"></h2><button id="close">إغلاق</button></dialog><script>
let products=[];const $=id=>document.getElementById(id);const safe=s=>String(s??'');
function render(){const q=$('search').value.trim().toLocaleLowerCase('ar'),cat=$('category').value;const shown=products.filter(p=>(!cat||p.category===cat)&&[p.name,p.code,p.description,p.category].some(v=>safe(v).toLocaleLowerCase('ar').includes(q)));const grid=$('grid');grid.replaceChildren();for(const p of shown){const card=document.createElement('article');card.className='card';const img=document.createElement('img');img.src=p.image;img.alt=p.name||'صورة المنتج';img.loading='lazy';img.onerror=()=>{img.style.display='none'};const box=document.createElement('div');box.className='content';const h=document.createElement('h2');h.textContent=p.name||'منتج';const tag=document.createElement('div');tag.className='tag';tag.textContent=[p.category,p.code].filter(Boolean).join(' • ');const desc=document.createElement('p');desc.className='desc';desc.textContent=p.description||'';const btn=document.createElement('button');btn.textContent='عرض الصورة';btn.onclick=()=>{$('previewImage').src=p.image;$('previewTitle').textContent=p.name;$('preview').showModal()};box.append(h,tag,desc,btn);card.append(img,box);grid.append(card)}$('status').textContent=shown.length?'عدد المنتجات: '+shown.length:(products.length?'لا توجد منتجات مطابقة للبحث':'المعرض جاهز. لم تتم إضافة منتجات بعد.')}
$('search').addEventListener('input',render);$('category').addEventListener('change',render);$('close').onclick=()=>$('preview').close();
fetch('./products.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('تعذر تحميل البيانات');return r.json()}).then(data=>{products=Array.isArray(data)?data.filter(p=>p&&p.image):[];for(const cat of [...new Set(products.map(p=>p.category).filter(Boolean))]){const o=document.createElement('option');o.value=cat;o.textContent=cat;$('category').append(o)}render()}).catch(e=>{$('status').textContent=e.message});
</script></body></html>
