<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>زين | دخول الفريق</title><style>*{box-sizing:border-box}body{margin:0;background:#120e0c;color:#f8e6c5;font-family:Tahoma,Arial,sans-serif;min-height:100dvh;display:grid;place-items:center;padding:18px}.card{width:min(100%,440px);background:#241a15;border:1px solid #a37b43;border-radius:18px;padding:26px;box-shadow:0 16px 60px #0006}h1{text-align:center;color:#f3c677;margin:0 0 8px}p{text-align:center;color:#d5b98e}label{display:block;margin:17px 0 8px}input{width:100%;padding:15px;background:#fff9ef;color:#241914;border:2px solid #b58a4a;border-radius:10px;font-size:16px}button{font-size:16px;cursor:pointer;border:0;border-radius:10px;padding:13px 16px}button.primary{width:100%;background:#e1b45e;color:#21150a;font-weight:bold;margin-top:17px}.password-wrap{position:relative}.password-wrap input{padding-left:90px}.password-wrap button{position:absolute;left:5px;top:5px;background:#4b3827;color:#fff;font-size:13px;padding:10px}#msg{min-height:30px;color:#ffd39b;line-height:1.7}a{color:#f3c677}small{display:block;text-align:center;color:#b8a28a;margin-top:18px}</style></head><body><div class="card"><h1>زين | ZAIN</h1><p>تسجيل دخول فريق العمل</p><form id="form" autocomplete="on"><label for="email">البريد الإلكتروني</label><input id="email" name="username" type="email" autocomplete="username" inputmode="email" autocapitalize="none" required><label for="password">كلمة المرور</label><div class="password-wrap"><input id="password" name="password" type="password" autocomplete="current-password" required><button type="button" id="eye">إظهار</button></div><button class="primary" type="submit" id="submit">دخول إلى زين</button></form><p id="msg" role="status"></p><small><a href="./">العودة إلى الموقع</a></small></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const sb=window.supabase.createClient("https://ycfmmulwumzuavgywzgy.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InljZm1tdWx3dW16dWF2Z3l3emd5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ4NjkzNDcsImV4cCI6MjExMDQ0NTM0N30.F3tw-mkJb5IMY7cww6p3Rse0ewrPxIJQ6mwce1MpV_4",{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:false}});
const email=document.getElementById('email'),password=document.getElementById('password'),msg=document.getElementById('msg'),submit=document.getElementById('submit');
document.getElementById('eye').addEventListener('click',()=>{const show=password.type==='password';password.type=show?'text':'password';document.getElementById('eye').textContent=show?'إخفاء':'إظهار'});
const notice=new URLSearchParams(location.search).get('notice');if(notice)msg.textContent=notice;
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();if(submit.disabled)return;const mail=email.value.trim(),pass=password.value;if(!mail||!pass)return;submit.disabled=true;msg.textContent='جاري تسجيل الدخول...';try{const {data,error}=await sb.auth.signInWithPassword({email:mail,password:pass});if(error){msg.textContent='تعذر الدخول: '+error.message;return}if(!data.session){msg.textContent='لم يتم إنشاء جلسة دخول، حاول مرة أخرى';return}msg.textContent='تم تسجيل الدخول، جاري فتح لوحة الإدارة...';location.replace('./')}catch(err){msg.textContent='خطأ في الاتصال: '+(err.message||'حاول مجددًا')}finally{submit.disabled=false}});
</script></body></html>
